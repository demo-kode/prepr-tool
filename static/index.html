<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PrePR · Local code review</title><link rel="stylesheet" href="/style.css"><script src="/languages.js" defer></script><script src="/highlight.js" defer></script><script src="/app.js" defer></script><script src="/submission.js" defer></script><script src="/live-review.js" defer></script></head>
<body>
<header class="topbar"><div class="top-left"><a class="brand" href="https://github.com/demo-kode/prepr-tool" target="_blank" rel="noopener noreferrer" aria-label="PrePR on GitHub" title="github.com/demo-kode/prepr-tool"><span class="brand-icon">⌁</span> PrePR <span class="local">LOCAL</span></a><a class="all-reviews" href="/">All reviews</a></div><div class="top-right"><span id="watcher-indicator" role="status" aria-live="polite" title="No agent is watching this review"><span class="dot" aria-hidden="true"></span><span class="watcher-label">Not watching</span></span><span id="watcher-action"></span><label class="identity">Comment as <input id="author" aria-label="Comment author" maxlength="100" value="Reviewer"></label></div></header>
<main id="app"><div class="loading">Loading reviews…</div></main>
<dialog id="submission" aria-labelledby="submission-title">
  <div class="submission-heading"><h2 id="submission-title">Pull request submission</h2><p class="submission-review"></p></div>
  <div class="submission-meter"><strong class="submission-summary" role="status"></strong><span class="submission-count"></span></div>
  <progress aria-label="PR submission progress" value="0" max="1"></progress>
  <ul aria-label="Repository progress" aria-live="polite"></ul>
  <p class="submission-note" role="status"></p><div class="submission-result"></div>
  <footer><button type="button" autofocus>Hide progress</button></footer>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
