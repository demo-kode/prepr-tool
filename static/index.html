<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PrePR · Local code review</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23aaa0ff%22/%3E%3Cpath d=%22M8.7 7.3v9.4M8.7 12.9c2.8 0 5.6-.5 5.6-3.7M12.5 15.7l1.7 1.5 3-3.3%22 fill=%22none%22 stroke=%22%2314121f%22 stroke-width=%222.05%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"><script src="/languages.js" defer></script><script src="/highlight.js" defer></script><script src="/app.js" defer></script><script src="/submission.js" defer></script><script src="/live-review.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="https://github.com/demo-kode/prepr-tool" target="_blank" rel="noopener noreferrer" aria-label="PrePR on GitHub" title="PrePR · github.com/demo-kode/prepr-tool"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#aaa0ff"/><path d="M8.7 7.3v9.4M8.7 12.9c2.8 0 5.6-.5 5.6-3.7M12.5 15.7l1.7 1.5 3-3.3" fill="none" stroke="#14121f" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round"/></svg></a><nav class="crumb" aria-label="Location"><a class="all-reviews" href="/">Reviews</a><span class="crumb-review"></span></nav><div class="top-right"><span id="watcher-indicator" role="status" aria-live="polite" title="No agent is watching this review"><span class="dot" aria-hidden="true"></span><span class="watcher-label">Not watching</span></span><span id="watcher-action"></span><span id="review-tools"></span></div></header>
<main id="app"><div class="loading">Loading reviews…</div></main>
<dialog id="submission" aria-labelledby="submission-title">
  <div class="submission-heading"><h2 id="submission-title">Pull request submission</h2><p class="submission-review"></p></div>
  <div class="submission-meter"><strong class="submission-summary" role="status"></strong><span class="submission-count"></span></div>
  <progress aria-label="PR submission progress" value="0" max="1"></progress>
  <ul aria-label="Repository progress" aria-live="polite"></ul>
  <p class="submission-note" role="status"></p><div class="submission-result"></div>
  <footer><button type="button" autofocus>Hide progress</button></footer>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
