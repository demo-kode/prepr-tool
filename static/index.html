<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PrePR · Local code review</title><link rel="stylesheet" href="/style.css"><script src="/languages.js" defer></script><script src="/highlight.js" defer></script><script src="/app.js" defer></script><script src="/live-review.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="https://github.com/demo-kode/prepr-tool" target="_blank" rel="noopener noreferrer" aria-label="PrePR on GitHub" title="github.com/demo-kode/prepr-tool"><span class="brand-icon">⌁</span> PrePR <span class="local">LOCAL</span></a><div class="top-right"><span id="watcher-indicator" role="status" aria-live="polite" title="No agent is watching this review"><span class="dot" aria-hidden="true"></span><span class="watcher-label">Not watching</span></span><span id="watcher-action"></span><label class="identity">Comment as <input id="author" aria-label="Comment author" maxlength="100" value="Reviewer"></label></div></header>
<main id="app"><div class="loading">Loading reviews…</div></main>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
